<!doctype html>
<html lang="zh-Hant">

    <meta name="color-scheme" content="light dark" />
    <title>出席點名</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <input type="file" id="importFile" accept="application/json" hidden />
